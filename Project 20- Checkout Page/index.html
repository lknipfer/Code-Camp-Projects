<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Page</title>
</head>
<body>
    <h1>Checkout</h1>
    <section>
        <h2>Your Cart</h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="A rubics cube that is mid turn in all 3 sections">
    </section>
    <section>
        <h2>Payment Information</h2>
            <form>
                <label for="card-name">Cardholder Name <span class="required" aria-hidden="true">*</span></label>
                <input id="card-name" name="card-name" type="text" required>
                <label for="card-number">Card Number <span class="required" aria-hidden="true">*</span></label>
                <input id="card-number" name="card-number" type="text" aria-describedby="card-number-help" required>
                <p id="card-number-help">Please enter your 16-digit card number without spaces or dashes.</p>
                <label for="expiration-date">Expiration Date <span class="required" aria-hidden="true">*</span></label>
                <input id="expiration-date" name="expiration-date" type="text" placeholder="MM/YY" required>
                <label for="CVV">CVV <span class="required" aria-hidden="true">*</span></label>
                <input id="CVV" name="CVV" type="text" required>
                <button>Place Order</button>
            </form>
    </section>
</body>
</html>
